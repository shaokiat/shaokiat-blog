<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Probe timeline: the startup probe fails until the app is up, then readiness and liveness begin; a readiness failure removes the Pod from Service endpoints without restarting it; three liveness failures make the kubelet restart the container">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4a7fa5"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="960" height="380" rx="14" fill="#202329" stroke="#3f4854" stroke-width="1.5"/>
  <text x="26" y="30" font-size="10" font-weight="600" letter-spacing="1.2" fill="#8896a8">ONE CONTAINER&#x27;S LIFE · TIME →</text>
  <text x="30" y="88" text-anchor="start" font-size="13" fill="#c5d5e8" font-weight="700">startupProbe</text>
  <text x="30" y="104" text-anchor="start" font-size="11" fill="#8896a8">gates the other two</text>
  <text x="30" y="158" text-anchor="start" font-size="13" fill="#c5d5e8" font-weight="700">readinessProbe</text>
  <text x="30" y="174" text-anchor="start" font-size="11" fill="#8896a8">controls traffic</text>
  <text x="30" y="228" text-anchor="start" font-size="13" fill="#c5d5e8" font-weight="700">livenessProbe</text>
  <text x="30" y="244" text-anchor="start" font-size="11" fill="#8896a8">controls restarts</text>
  <text x="30" y="298" text-anchor="start" font-size="13" fill="#c5d5e8" font-weight="700">In Service endpoints?</text>
  <text x="30" y="314" text-anchor="start" font-size="11" fill="#8896a8">result of readiness</text>
  <rect x="220" y="76" width="180" height="28" rx="6" fill="#2a2f37" stroke="#5b6675" stroke-width="1.2"/><text x="310" y="94" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8896a8">failing, within 30 × 10s budget</text>
  <rect x="400" y="76" width="40" height="28" rx="6" fill="#1f3529" stroke="#4a8f6a" stroke-width="1.2"/><text x="420" y="94" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b8dcc6">pass</text>
  <text x="450" y="94" text-anchor="start" font-size="11" fill="#8896a8">stops after first success</text>
  <rect x="870" y="76" width="80" height="28" rx="6" fill="#2a2f37" stroke="#5b6675" stroke-width="1.2"/><text x="910" y="94" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8896a8">again</text>
  <rect x="220" y="146" width="180" height="28" rx="6" fill="none" stroke="#5b6675" stroke-width="1.2" stroke-dasharray="4 3"/><text x="310" y="164" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8896a8">not run yet</text>
  <rect x="400" y="146" width="160" height="28" rx="6" fill="#1f3529" stroke="#4a8f6a" stroke-width="1.2"/><text x="480" y="164" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b8dcc6">passing</text>
  <rect x="560" y="146" width="100" height="28" rx="6" fill="#3d3320" stroke="#a5822f" stroke-width="1.2"/><text x="610" y="164" text-anchor="middle" font-size="10.5" font-weight="600" fill="#e0cfa8">failing</text>
  <rect x="660" y="146" width="200" height="28" rx="6" fill="#1f3529" stroke="#4a8f6a" stroke-width="1.2"/><text x="760" y="164" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b8dcc6">passing</text>
  <rect x="870" y="146" width="80" height="28" rx="6" fill="none" stroke="#5b6675" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="220" y="216" width="180" height="28" rx="6" fill="none" stroke="#5b6675" stroke-width="1.2" stroke-dasharray="4 3"/><text x="310" y="234" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8896a8">not run yet</text>
  <rect x="400" y="216" width="370" height="28" rx="6" fill="#1f3529" stroke="#4a8f6a" stroke-width="1.2"/><text x="585" y="234" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b8dcc6">passing</text>
  <rect x="770" y="216" width="90" height="28" rx="6" fill="#3d3320" stroke="#a5822f" stroke-width="1.2"/><text x="815" y="234" text-anchor="middle" font-size="10.5" font-weight="600" fill="#e0cfa8">3 failures</text>
  <rect x="870" y="216" width="80" height="28" rx="6" fill="none" stroke="#5b6675" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="220" y="286" width="180" height="28" rx="6" fill="#2a2f37" stroke="#5b6675" stroke-width="1.2"/><text x="310" y="304" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8896a8">no traffic</text>
  <rect x="400" y="286" width="160" height="28" rx="6" fill="#1f3529" stroke="#4a8f6a" stroke-width="1.2"/><text x="480" y="304" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b8dcc6">receiving traffic</text>
  <rect x="560" y="286" width="100" height="28" rx="6" fill="#3d3320" stroke="#a5822f" stroke-width="1.2"/><text x="610" y="304" text-anchor="middle" font-size="10.5" font-weight="600" fill="#e0cfa8">removed</text>
  <rect x="660" y="286" width="200" height="28" rx="6" fill="#1f3529" stroke="#4a8f6a" stroke-width="1.2"/><text x="760" y="304" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b8dcc6">receiving traffic</text>
  <rect x="870" y="286" width="80" height="28" rx="6" fill="#2a2f37" stroke="#5b6675" stroke-width="1.2"/><text x="910" y="304" text-anchor="middle" font-size="10.5" font-weight="600" fill="#8896a8">no traffic</text>
  <line x1="400" y1="52" x2="400" y2="330" stroke="#4a7fa5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="865" y1="52" x2="865" y2="330" stroke="#a5822f" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="400" y="48" text-anchor="middle" font-size="11" fill="#c5d5e8" font-weight="600">startup passes</text>
  <text x="865" y="48" text-anchor="end" font-size="11" fill="#e0cfa8" font-weight="600">kubelet restarts the container</text>
  <text x="610" y="350" text-anchor="middle" font-size="11" fill="#e0cfa8">Readiness fails → removed, not restarted</text>
  <text x="950" y="350" text-anchor="end" font-size="11" fill="#e0cfa8">Liveness fails → restarted</text>
  <polyline points="220,372 950,372" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="220" y="366" text-anchor="start" font-size="10" fill="#8896a8">container starts</text>
</svg>
