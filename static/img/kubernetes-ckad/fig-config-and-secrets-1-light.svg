<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="A ConfigMap and a Secret reach a container two ways: as environment variables copied once at start, or as mounted files the kubelet refreshes">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a6f9a"/>
    </marker>
  </defs>

  <rect x="10" y="20" width="260" height="340" rx="14" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="26" y="40" font-size="10" font-weight="600" letter-spacing="1.2" fill="#52606d">SOURCE OBJECTS</text>
  <rect x="30" y="70" width="220" height="64" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="140" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">ConfigMap app-config</text>
  <text x="140" y="116" text-anchor="middle" font-size="11" fill="#4a5568">LOG_LEVEL=info</text>
  <rect x="30" y="230" width="220" height="64" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="140" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Secret db-creds</text>
  <text x="140" y="276" text-anchor="middle" font-size="11" fill="#4a5568">base64, not encrypted</text>
  <rect x="340" y="20" width="610" height="340" rx="14" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="356" y="40" font-size="10" font-weight="600" letter-spacing="1.2" fill="#52606d">POD</text>
  <rect x="400" y="66" width="240" height="72" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="520" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Environment variables</text>
  <text x="520" y="116" text-anchor="middle" font-size="11" fill="#4a5568">copied once at container start</text>
  <rect x="400" y="226" width="240" height="72" rx="8" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.5"/>
  <text x="520" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5c3d">Mounted files</text>
  <text x="520" y="269" text-anchor="middle" font-size="11" fill="#4a5568">/etc/config/LOG_LEVEL</text>
  <text x="520" y="283" text-anchor="middle" font-size="11" fill="#4a5568">kubelet refreshes, ~1 min</text>
  <rect x="700" y="66" width="230" height="232" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="815" y="177" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">app container</text>
  <text x="815" y="196" text-anchor="middle" font-size="11" fill="#4a5568">reads env and files</text>
  <polyline points="252,102 290,102" fill="none" stroke="#3a6f9a" stroke-width="1.5"/>
  <polyline points="252,262 290,262" fill="none" stroke="#3a6f9a" stroke-width="1.5"/>
  <polyline points="290,102 290,262" fill="none" stroke="#3a6f9a" stroke-width="1.5"/>
  <polyline points="290,102 398,102" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="290,262 398,262" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="345" y="94" text-anchor="middle" font-size="11" fill="#4a5568" stroke="#f6f8fa" stroke-width="4" paint-order="stroke">env / envFrom</text>
  <text x="345" y="254" text-anchor="middle" font-size="11" fill="#4a5568" stroke="#f6f8fa" stroke-width="4" paint-order="stroke">volume</text>
  <polyline points="642,102 698,102" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="642,262 698,262" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="520" y="162" text-anchor="middle" font-size="11" fill="#713f12" font-weight="600">Edit the ConfigMap → no change</text>
  <text x="520" y="177" text-anchor="middle" font-size="11" fill="#4a5568">until the container restarts</text>
  <text x="520" y="322" text-anchor="middle" font-size="11" fill="#1f5c3d" font-weight="600">Edit the ConfigMap → files change</text>
  <text x="520" y="337" text-anchor="middle" font-size="11" fill="#4a5568">in place (not with subPath)</text>
</svg>
