<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="RBAC: a RoleBinding connects subjects (a user or a ServiceAccount) to a Role, whose rules grant verbs on resources inside one namespace; a RoleBinding may also reference a ClusterRole, still scoped to the namespace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4a7fa5"/>
    </marker>
  </defs>

  <rect x="20" y="70" width="170" height="64" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="105" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">User jane</text>
  <text x="105" y="116" text-anchor="middle" font-size="11" fill="#8896a8">from cert or OIDC</text>
  <text x="105" y="156" text-anchor="middle" font-size="11" fill="#8896a8">Users are not API objects</text>
  <rect x="220" y="20" width="720" height="290" rx="14" fill="#202329" stroke="#3f4854" stroke-width="1.5"/>
  <text x="236" y="40" font-size="10" font-weight="600" letter-spacing="1.2" fill="#8896a8">NAMESPACE · TEAM-A</text>
  <rect x="245" y="200" width="190" height="64" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="340" y="227" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">ServiceAccount ci-bot</text>
  <text x="340" y="246" text-anchor="middle" font-size="11" fill="#8896a8">identity for Pods</text>
  <rect x="480" y="110" width="180" height="64" rx="8" fill="#3d3320" stroke="#a5822f" stroke-width="1.5"/>
  <text x="570" y="137" text-anchor="middle" font-size="13" font-weight="700" fill="#e0cfa8">RoleBinding</text>
  <text x="570" y="156" text-anchor="middle" font-size="11" fill="#8896a8">subjects → roleRef</text>
  <rect x="730" y="56" width="190" height="64" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="825" y="83" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Role deployer</text>
  <text x="825" y="102" text-anchor="middle" font-size="11" fill="#8896a8">rules: verbs on resources</text>
  <rect x="730" y="186" width="190" height="90" rx="8" fill="#1f3529" stroke="#4a8f6a" stroke-width="1.5"/>
  <text x="825" y="219" text-anchor="middle" font-size="13" font-weight="700" fill="#b8dcc6">deployments, pods</text>
  <text x="825" y="238" text-anchor="middle" font-size="11" fill="#8896a8">get · list · create · update</text>
  <text x="825" y="252" text-anchor="middle" font-size="11" fill="#8896a8">in team-a only</text>
  <polyline points="192,102 478,130" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="335" y="108" text-anchor="middle" font-size="11" fill="#8896a8" stroke="#202329" stroke-width="4" paint-order="stroke">subject</text>
  <polyline points="437,232 478,158" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="470" y="212" text-anchor="start" font-size="11" fill="#8896a8" stroke="#202329" stroke-width="4" paint-order="stroke">subject</text>
  <polyline points="662,136 728,94" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="702" y="142" text-anchor="middle" font-size="11" fill="#8896a8" stroke="#202329" stroke-width="4" paint-order="stroke">roleRef</text>
  <polyline points="825,122 825,184" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="833" y="158" text-anchor="start" font-size="11" fill="#8896a8" stroke="#202329" stroke-width="4" paint-order="stroke">grants</text>
  <rect x="480" y="346" width="180" height="64" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="570" y="373" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">ClusterRole view</text>
  <text x="570" y="392" text-anchor="middle" font-size="11" fill="#8896a8">defined cluster-wide</text>
  <polyline points="570,176 570,344" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <text x="580" y="322" text-anchor="start" font-size="11" fill="#8896a8">roleRef may name a ClusterRole:</text>
  <text x="580" y="337" text-anchor="start" font-size="11" fill="#8896a8">permissions still stop at team-a</text>
</svg>
