<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Request path: client to Ingress to Service to EndpointSlice to Pods; the Service selects Pods only by label, and NetworkPolicy gates traffic entering the namespace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a6f9a"/>
    </marker>
  </defs>

  <rect x="20" y="172" width="110" height="66" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="75" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Client</text>
  <text x="75" y="219" text-anchor="middle" font-size="11" fill="#4a5568">shop.example.com</text>
  <rect x="150" y="10" width="935" height="380" rx="14" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="166" y="30" font-size="10" font-weight="600" letter-spacing="1.2" fill="#52606d">CLUSTER</text>
  <rect x="180" y="172" width="130" height="66" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="245" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Ingress</text>
  <text x="245" y="219" text-anchor="middle" font-size="11" fill="#4a5568">host + path rules</text>
  <rect x="370" y="172" width="150" height="66" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="445" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Service api</text>
  <text x="445" y="219" text-anchor="middle" font-size="11" fill="#4a5568">selector app=api</text>
  <rect x="580" y="172" width="150" height="66" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="655" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">EndpointSlice</text>
  <text x="655" y="219" text-anchor="middle" font-size="11" fill="#4a5568">Ready Pod IPs :8080</text>
  <rect x="790" y="40" width="285" height="330" rx="12" fill="#eef2f6" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="804" y="59" font-size="10" font-weight="600" letter-spacing="1.2" fill="#52606d">NAMESPACE · SHOP</text>
  <polyline points="132,205 178,205" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="155" y="197" text-anchor="middle" font-size="11" fill="#4a5568" stroke="#f6f8fa" stroke-width="4" paint-order="stroke">HTTPS</text>
  <polyline points="312,205 368,205" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="340" y="197" text-anchor="middle" font-size="11" fill="#4a5568">/api</text>
  <polyline points="522,205 578,205" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="550" y="197" text-anchor="middle" font-size="11" fill="#4a5568">resolves</text>
  <polyline points="732,205 760,205" fill="none" stroke="#3a6f9a" stroke-width="1.5"/>
  <polyline points="760,105 760,205" fill="none" stroke="#3a6f9a" stroke-width="1.5"/>
  <polyline points="760,105 828,105" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="760,205 828,205" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="830" y="70" width="230" height="70" rx="8" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.5"/>
  <text x="838" y="85" font-size="9" font-weight="600" letter-spacing="1" fill="#2d7a52">POD</text>
  <text x="945" y="109" text-anchor="middle" font-size="12" font-weight="600" fill="#1f5c3d">api-7d4f-x2k</text>
  <text x="945" y="125" text-anchor="middle" font-size="10.5" fill="#4a5568">10.244.1.5 · Ready</text>
  <rect x="989" y="76" width="63" height="18" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="1020.5" y="89" text-anchor="middle" font-size="10.5" font-weight="600" fill="#713f12">app=api</text>
  <rect x="830" y="170" width="230" height="70" rx="8" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.5"/>
  <text x="838" y="185" font-size="9" font-weight="600" letter-spacing="1" fill="#2d7a52">POD</text>
  <text x="945" y="209" text-anchor="middle" font-size="12" font-weight="600" fill="#1f5c3d">api-7d4f-m9p</text>
  <text x="945" y="225" text-anchor="middle" font-size="10.5" fill="#4a5568">10.244.2.7 · Ready</text>
  <rect x="989" y="176" width="63" height="18" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="1020.5" y="189" text-anchor="middle" font-size="10.5" font-weight="600" fill="#713f12">app=api</text>
  <rect x="830" y="270" width="230" height="70" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="838" y="285" font-size="9" font-weight="600" letter-spacing="1" fill="#94a3b8">POD</text>
  <text x="945" y="309" text-anchor="middle" font-size="12" font-weight="600" fill="#52606d">web-5c9b-q7m</text>
  <text x="945" y="325" text-anchor="middle" font-size="10.5" fill="#4a5568">no matching label</text>
  <rect x="989" y="276" width="63" height="18" rx="9" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.2"/><text x="1020.5" y="289" text-anchor="middle" font-size="10.5" font-weight="600" fill="#52606d">app=web</text>
  <rect x="786" y="94" width="8" height="22" rx="2" fill="#52606d"/>
  <rect x="786" y="194" width="8" height="22" rx="2" fill="#52606d"/>
  <text x="790" y="234" text-anchor="middle" font-size="10" fill="#52606d" font-weight="600">NetworkPolicy</text>
  <text x="790" y="247" text-anchor="middle" font-size="10" fill="#52606d">gate</text>
  <text x="180" y="312" text-anchor="start" font-size="11" fill="#713f12" font-weight="600">The Service finds Pods only by label.</text>
  <text x="180" y="329" text-anchor="start" font-size="11" fill="#4a5568">No name, IP or ownership link exists. A typo in either label</text>
  <text x="180" y="344" text-anchor="start" font-size="11" fill="#4a5568">means an empty EndpointSlice and no traffic.</text>
</svg>
