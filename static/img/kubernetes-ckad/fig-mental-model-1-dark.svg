<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 575" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Sequence of a kubectl apply: the API server stores the Deployment; the Deployment controller creates a ReplicaSet; the ReplicaSet controller creates Pods; the scheduler binds them to nodes; the kubelet starts containers and reports Ready; the EndpointSlice controller adds the Pod IPs. Every arrow starts or ends at the API server">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4a7fa5"/>
    </marker>
  </defs>

  <rect x="11" y="16" width="128" height="56" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="75" y="39" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">kubectl</text>
  <text x="75" y="58" text-anchor="middle" font-size="11" fill="#8896a8">you</text>
  <line x1="75" y1="74" x2="75" y2="560" stroke="#3f4854" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="153" y="16" width="128" height="56" rx="8" fill="#3d3320" stroke="#a5822f" stroke-width="1.5"/>
  <text x="217" y="39" text-anchor="middle" font-size="13" font-weight="700" fill="#e0cfa8">kube-apiserver</text>
  <text x="217" y="58" text-anchor="middle" font-size="11" fill="#8896a8">stores in etcd</text>
  <line x1="217" y1="74" x2="217" y2="560" stroke="#a5822f" stroke-width="2" stroke-dasharray=""/>
  <rect x="295" y="16" width="128" height="56" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="359" y="39" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Deployment</text>
  <text x="359" y="58" text-anchor="middle" font-size="11" fill="#8896a8">controller</text>
  <line x1="359" y1="74" x2="359" y2="560" stroke="#3f4854" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="437" y="16" width="128" height="56" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="501" y="39" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">ReplicaSet</text>
  <text x="501" y="58" text-anchor="middle" font-size="11" fill="#8896a8">controller</text>
  <line x1="501" y1="74" x2="501" y2="560" stroke="#3f4854" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="579" y="16" width="128" height="56" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="643" y="39" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">kube-scheduler</text>
  <text x="643" y="58" text-anchor="middle" font-size="11" fill="#8896a8">picks a node</text>
  <line x1="643" y1="74" x2="643" y2="560" stroke="#3f4854" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="721" y="16" width="128" height="56" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="785" y="39" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">kubelet</text>
  <text x="785" y="58" text-anchor="middle" font-size="11" fill="#8896a8">on the node</text>
  <line x1="785" y1="74" x2="785" y2="560" stroke="#3f4854" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="863" y="16" width="128" height="56" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="927" y="39" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">EndpointSlice</text>
  <text x="927" y="58" text-anchor="middle" font-size="11" fill="#8896a8">controller</text>
  <line x1="927" y1="74" x2="927" y2="560" stroke="#3f4854" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polyline points="75,112 204,112" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="146" y="104" text-anchor="middle" font-size="11" fill="#8896a8" stroke="#1b1b1d" stroke-width="4" paint-order="stroke">apply Deployment</text>
  <circle cx="217" cy="112" r="11" fill="#3d3320" stroke="#a5822f" stroke-width="1.5"/><text x="217" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#e0cfa8">1</text>
  <text x="233" y="131" text-anchor="start" font-size="11" fill="#8896a8" stroke="#1b1b1d" stroke-width="4" paint-order="stroke">validate, store spec</text>
  <polyline points="230,180 355,180" fill="none" stroke="#4a7fa5" stroke-width="1.2" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <text x="351" y="174" text-anchor="end" font-size="11" fill="#8896a8" stroke="#1b1b1d" stroke-width="4" paint-order="stroke">watch: new Deployment</text>
  <polyline points="359,206 230,206" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="235" y="200" text-anchor="start" font-size="11" fill="#8896a8" stroke="#1b1b1d" stroke-width="4" paint-order="stroke">create ReplicaSet</text>
  <circle cx="217" cy="206" r="11" fill="#3d3320" stroke="#a5822f" stroke-width="1.5"/><text x="217" y="210" text-anchor="middle" font-size="11" font-weight="700" fill="#e0cfa8">2</text>
  <polyline points="230,258 497,258" fill="none" stroke="#4a7fa5" stroke-width="1.2" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <text x="493" y="252" text-anchor="end" font-size="11" fill="#8896a8" stroke="#1b1b1d" stroke-width="4" paint-order="stroke">watch: new ReplicaSet</text>
  <polyline points="501,284 230,284" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="235" y="278" text-anchor="start" font-size="11" fill="#8896a8" stroke="#1b1b1d" stroke-width="4" paint-order="stroke">create 3 Pods</text>
  <circle cx="217" cy="284" r="11" fill="#3d3320" stroke="#a5822f" stroke-width="1.5"/><text x="217" y="288" text-anchor="middle" font-size="11" font-weight="700" fill="#e0cfa8">3</text>
  <polyline points="230,336 639,336" fill="none" stroke="#4a7fa5" stroke-width="1.2" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <text x="635" y="330" text-anchor="end" font-size="11" fill="#8896a8" stroke="#1b1b1d" stroke-width="4" paint-order="stroke">watch: unscheduled Pods</text>
  <polyline points="643,362 230,362" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="235" y="356" text-anchor="start" font-size="11" fill="#8896a8" stroke="#1b1b1d" stroke-width="4" paint-order="stroke">bind Pod → node</text>
  <circle cx="217" cy="362" r="11" fill="#3d3320" stroke="#a5822f" stroke-width="1.5"/><text x="217" y="366" text-anchor="middle" font-size="11" font-weight="700" fill="#e0cfa8">4</text>
  <polyline points="230,414 781,414" fill="none" stroke="#4a7fa5" stroke-width="1.2" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <text x="777" y="408" text-anchor="end" font-size="11" fill="#8896a8" stroke="#1b1b1d" stroke-width="4" paint-order="stroke">watch: Pod bound here</text>
  <polyline points="785,440 230,440" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="235" y="434" text-anchor="start" font-size="11" fill="#8896a8" stroke="#1b1b1d" stroke-width="4" paint-order="stroke">status: Running, Ready</text>
  <circle cx="217" cy="440" r="11" fill="#3d3320" stroke="#a5822f" stroke-width="1.5"/><text x="217" y="444" text-anchor="middle" font-size="11" font-weight="700" fill="#e0cfa8">5</text>
  <polyline points="230,492 923,492" fill="none" stroke="#4a7fa5" stroke-width="1.2" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <text x="919" y="486" text-anchor="end" font-size="11" fill="#8896a8" stroke="#1b1b1d" stroke-width="4" paint-order="stroke">watch: Pod Ready</text>
  <polyline points="927,518 230,518" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="235" y="512" text-anchor="start" font-size="11" fill="#8896a8" stroke="#1b1b1d" stroke-width="4" paint-order="stroke">add Pod IP</text>
  <circle cx="217" cy="518" r="11" fill="#3d3320" stroke="#a5822f" stroke-width="1.5"/><text x="217" y="522" text-anchor="middle" font-size="11" font-weight="700" fill="#e0cfa8">6</text>
  <text x="793" y="431" text-anchor="start" font-size="10" fill="#8896a8" stroke="#1b1b1d" stroke-width="4" paint-order="stroke" font-style="italic">starts containers via runtime</text>
</svg>
