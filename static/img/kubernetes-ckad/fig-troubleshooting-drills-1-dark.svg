<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 290" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="The Pod lifecycle from admission to Service routing, with the failure status each stage produces, the first command to run, and the drill that exercises it">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4a7fa5"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="1030" height="270" rx="14" fill="#202329" stroke="#3f4854" stroke-width="1.5"/>
  <text x="26" y="30" font-size="10" font-weight="600" letter-spacing="1.2" fill="#8896a8">POD LIFECYCLE · WHERE EACH DRILL BREAKS</text>
  <rect x="25" y="50" width="125" height="60" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="87.5" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Admission</text>
  <text x="87.5" y="94" text-anchor="middle" font-size="11" fill="#8896a8">API server</text>
  <line x1="87.5" y1="114" x2="87.5" y2="134" stroke="#a5822f" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="87.5" y="150" text-anchor="middle" font-size="11" fill="#e0cfa8" font-weight="600">no Pods</text>
  <text x="87.5" y="204" text-anchor="middle" font-size="11" fill="#8896a8">describe rs</text>
  <text x="87.5" y="240" text-anchor="middle" font-size="11" fill="#8896a8" font-weight="600">drill 1</text>
  <polyline points="152,80 168,80" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="170" y="50" width="125" height="60" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="232.5" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Scheduling</text>
  <text x="232.5" y="94" text-anchor="middle" font-size="11" fill="#8896a8">scheduler</text>
  <line x1="232.5" y1="114" x2="232.5" y2="134" stroke="#a5822f" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="232.5" y="150" text-anchor="middle" font-size="11" fill="#e0cfa8" font-weight="600">Pending</text>
  <text x="232.5" y="204" text-anchor="middle" font-size="11" fill="#8896a8">describe pod</text>
  <text x="232.5" y="240" text-anchor="middle" font-size="11" fill="#8896a8" font-weight="600">drill 2</text>
  <polyline points="297,80 313,80" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="315" y="50" width="125" height="60" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="377.5" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Image pull</text>
  <text x="377.5" y="94" text-anchor="middle" font-size="11" fill="#8896a8">kubelet + runtime</text>
  <line x1="377.5" y1="114" x2="377.5" y2="134" stroke="#a5822f" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="377.5" y="150" text-anchor="middle" font-size="11" fill="#e0cfa8" font-weight="600">ImagePullBackOff</text>
  <text x="377.5" y="204" text-anchor="middle" font-size="11" fill="#8896a8">describe pod</text>
  <text x="377.5" y="240" text-anchor="middle" font-size="11" fill="#8896a8" font-weight="600">drill 3</text>
  <polyline points="442,80 458,80" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="460" y="50" width="125" height="60" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="522.5" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Config</text>
  <text x="522.5" y="94" text-anchor="middle" font-size="11" fill="#8896a8">kubelet</text>
  <line x1="522.5" y1="114" x2="522.5" y2="134" stroke="#a5822f" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="522.5" y="150" text-anchor="middle" font-size="11" fill="#e0cfa8" font-weight="600">CreateContainer-</text>
  <text x="522.5" y="166" text-anchor="middle" font-size="11" fill="#e0cfa8" font-weight="600">ConfigError</text>
  <text x="522.5" y="204" text-anchor="middle" font-size="11" fill="#8896a8">describe pod</text>
  <text x="522.5" y="240" text-anchor="middle" font-size="11" fill="#8896a8" font-weight="600">drill 4</text>
  <polyline points="587,80 603,80" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="605" y="50" width="125" height="60" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="667.5" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Run</text>
  <text x="667.5" y="94" text-anchor="middle" font-size="11" fill="#8896a8">your process</text>
  <line x1="667.5" y1="114" x2="667.5" y2="134" stroke="#a5822f" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="667.5" y="150" text-anchor="middle" font-size="11" fill="#e0cfa8" font-weight="600">CrashLoopBackOff</text>
  <text x="667.5" y="166" text-anchor="middle" font-size="11" fill="#e0cfa8" font-weight="600">OOMKilled</text>
  <text x="667.5" y="204" text-anchor="middle" font-size="11" fill="#8896a8">logs --previous</text>
  <text x="667.5" y="240" text-anchor="middle" font-size="11" fill="#8896a8" font-weight="600">drill 5, 6</text>
  <polyline points="732,80 748,80" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="750" y="50" width="125" height="60" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="812.5" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Readiness</text>
  <text x="812.5" y="94" text-anchor="middle" font-size="11" fill="#8896a8">kubelet probes</text>
  <line x1="812.5" y1="114" x2="812.5" y2="134" stroke="#a5822f" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="812.5" y="150" text-anchor="middle" font-size="11" fill="#e0cfa8" font-weight="600">0/1 Ready</text>
  <text x="812.5" y="204" text-anchor="middle" font-size="11" fill="#8896a8">describe pod</text>
  <text x="812.5" y="240" text-anchor="middle" font-size="11" fill="#8896a8" font-weight="600">drill 7</text>
  <polyline points="877,80 893,80" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="895" y="50" width="125" height="60" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="957.5" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Routing</text>
  <text x="957.5" y="94" text-anchor="middle" font-size="11" fill="#8896a8">Service + proxy</text>
  <line x1="957.5" y1="114" x2="957.5" y2="134" stroke="#a5822f" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="957.5" y="150" text-anchor="middle" font-size="11" fill="#e0cfa8" font-weight="600">refused /</text>
  <text x="957.5" y="166" text-anchor="middle" font-size="11" fill="#e0cfa8" font-weight="600">timeout</text>
  <text x="957.5" y="204" text-anchor="middle" font-size="11" fill="#8896a8">describe svc</text>
  <text x="957.5" y="240" text-anchor="middle" font-size="11" fill="#8896a8" font-weight="600">drill 8</text>
</svg>
