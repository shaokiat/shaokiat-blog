<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="A ConfigMap and a Secret reach a container two ways: as environment variables copied once at start, or as mounted files the kubelet refreshes">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4a7fa5"/>
    </marker>
  </defs>

  <rect x="10" y="20" width="260" height="340" rx="14" fill="#202329" stroke="#3f4854" stroke-width="1.5"/>
  <text x="26" y="40" font-size="10" font-weight="600" letter-spacing="1.2" fill="#8896a8">SOURCE OBJECTS</text>
  <rect x="30" y="70" width="220" height="64" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="140" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">ConfigMap app-config</text>
  <text x="140" y="116" text-anchor="middle" font-size="11" fill="#8896a8">LOG_LEVEL=info</text>
  <rect x="30" y="230" width="220" height="64" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="140" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Secret db-creds</text>
  <text x="140" y="276" text-anchor="middle" font-size="11" fill="#8896a8">base64, not encrypted</text>
  <rect x="340" y="20" width="610" height="340" rx="14" fill="#202329" stroke="#3f4854" stroke-width="1.5"/>
  <text x="356" y="40" font-size="10" font-weight="600" letter-spacing="1.2" fill="#8896a8">POD</text>
  <rect x="400" y="66" width="240" height="72" rx="8" fill="#3d3320" stroke="#a5822f" stroke-width="1.5"/>
  <text x="520" y="97" text-anchor="middle" font-size="13" font-weight="700" fill="#e0cfa8">Environment variables</text>
  <text x="520" y="116" text-anchor="middle" font-size="11" fill="#8896a8">copied once at container start</text>
  <rect x="400" y="226" width="240" height="72" rx="8" fill="#1f3529" stroke="#4a8f6a" stroke-width="1.5"/>
  <text x="520" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#b8dcc6">Mounted files</text>
  <text x="520" y="269" text-anchor="middle" font-size="11" fill="#8896a8">/etc/config/LOG_LEVEL</text>
  <text x="520" y="283" text-anchor="middle" font-size="11" fill="#8896a8">kubelet refreshes, ~1 min</text>
  <rect x="700" y="66" width="230" height="232" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="815" y="177" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">app container</text>
  <text x="815" y="196" text-anchor="middle" font-size="11" fill="#8896a8">reads env and files</text>
  <polyline points="252,102 290,102" fill="none" stroke="#4a7fa5" stroke-width="1.5"/>
  <polyline points="252,262 290,262" fill="none" stroke="#4a7fa5" stroke-width="1.5"/>
  <polyline points="290,102 290,262" fill="none" stroke="#4a7fa5" stroke-width="1.5"/>
  <polyline points="290,102 398,102" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="290,262 398,262" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="345" y="94" text-anchor="middle" font-size="11" fill="#8896a8" stroke="#202329" stroke-width="4" paint-order="stroke">env / envFrom</text>
  <text x="345" y="254" text-anchor="middle" font-size="11" fill="#8896a8" stroke="#202329" stroke-width="4" paint-order="stroke">volume</text>
  <polyline points="642,102 698,102" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="642,262 698,262" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="520" y="162" text-anchor="middle" font-size="11" fill="#e0cfa8" font-weight="600">Edit the ConfigMap → no change</text>
  <text x="520" y="177" text-anchor="middle" font-size="11" fill="#8896a8">until the container restarts</text>
  <text x="520" y="322" text-anchor="middle" font-size="11" fill="#b8dcc6" font-weight="600">Edit the ConfigMap → files change</text>
  <text x="520" y="337" text-anchor="middle" font-size="11" fill="#8896a8">in place (not with subPath)</text>
</svg>
