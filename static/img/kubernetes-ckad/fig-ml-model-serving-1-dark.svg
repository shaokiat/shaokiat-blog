<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="ML model serving: Ingress and Service route to model-server Pods; an init container downloads the model from a bucket into an emptyDir; an HPA scales the Deployment and a PodDisruptionBudget limits evictions">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4a7fa5"/>
    </marker>
  </defs>

  <rect x="20" y="180" width="110" height="64" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="75" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Client</text>
  <text x="75" y="226" text-anchor="middle" font-size="11" fill="#8896a8">POST /predict</text>
  <rect x="20" y="330" width="125" height="64" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="82.5" y="357" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Model bucket</text>
  <text x="82.5" y="376" text-anchor="middle" font-size="11" fill="#8896a8">models/v7/</text>
  <rect x="160" y="10" width="830" height="420" rx="14" fill="#202329" stroke="#3f4854" stroke-width="1.5"/>
  <text x="176" y="30" font-size="10" font-weight="600" letter-spacing="1.2" fill="#8896a8">CLUSTER</text>
  <rect x="180" y="180" width="120" height="64" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="240" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Ingress</text>
  <text x="240" y="226" text-anchor="middle" font-size="11" fill="#8896a8">/predict</text>
  <rect x="330" y="180" width="130" height="64" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="395" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Service</text>
  <text x="395" y="226" text-anchor="middle" font-size="11" fill="#8896a8">Ready Pods only</text>
  <rect x="490" y="40" width="485" height="375" rx="12" fill="#2a2f37" stroke="#3f4854" stroke-width="1.5"/>
  <text x="504" y="59" font-size="10" font-weight="600" letter-spacing="1.2" fill="#8896a8">NAMESPACE · ML-SERVING</text>
  <rect x="510" y="66" width="200" height="56" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="610" y="89" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">HPA</text>
  <text x="610" y="108" text-anchor="middle" font-size="11" fill="#8896a8">CPU 60% of request · 2–10</text>
  <rect x="740" y="66" width="215" height="56" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="847.5" y="89" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">PodDisruptionBudget</text>
  <text x="847.5" y="108" text-anchor="middle" font-size="11" fill="#8896a8">minAvailable: 1</text>
  <rect x="510" y="150" width="445" height="185" rx="12" fill="#202329" stroke="#3f4854" stroke-width="1.5"/>
  <text x="524" y="169" font-size="10" font-weight="600" letter-spacing="1.2" fill="#8896a8">POD × N · DEPLOYMENT, MAXUNAVAILABLE 0</text>
  <rect x="530" y="190" width="190" height="64" rx="8" fill="#3d3320" stroke="#a5822f" stroke-width="1.5"/>
  <text x="625" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#e0cfa8">init: fetch-model</text>
  <text x="625" y="236" text-anchor="middle" font-size="11" fill="#8896a8">bucket → emptyDir</text>
  <rect x="760" y="190" width="180" height="64" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="850" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">model-server</text>
  <text x="850" y="236" text-anchor="middle" font-size="11" fill="#8896a8">loads /models</text>
  <text x="850" y="280" text-anchor="middle" font-size="11" fill="#8896a8">startupProbe: 10 min budget</text>
  <text x="850" y="296" text-anchor="middle" font-size="11" fill="#8896a8">liveness: /healthz only</text>
  <polyline points="132,212 178,212" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="155" y="204" text-anchor="middle" font-size="11" fill="#8896a8" stroke="#202329" stroke-width="4" paint-order="stroke">HTTPS</text>
  <polyline points="302,212 328,212" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="462,212 508,212" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="722,222 758,222" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="610,124 610,148" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="618" y="141" text-anchor="start" font-size="11" fill="#8896a8" stroke="#2a2f37" stroke-width="4" paint-order="stroke">scales</text>
  <polyline points="847,124 847,148" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="855" y="141" text-anchor="start" font-size="11" fill="#8896a8" stroke="#2a2f37" stroke-width="4" paint-order="stroke">limits evictions</text>
  <polyline points="147,380 625,380 625,256" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="390" y="372" text-anchor="middle" font-size="11" fill="#8896a8" stroke="#202329" stroke-width="4" paint-order="stroke">download once per Pod start</text>
</svg>
