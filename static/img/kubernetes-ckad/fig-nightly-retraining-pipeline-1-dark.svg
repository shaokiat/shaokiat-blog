<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Nightly retraining: a CronJob creates a Job at 02:00, whose Pod fetches data, trains on a PVC and pushes the model to a registry; with concurrencyPolicy Forbid, a run that overruns causes the next scheduled run to be skipped">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4a7fa5"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="980" height="290" rx="14" fill="#202329" stroke="#3f4854" stroke-width="1.5"/>
  <text x="26" y="30" font-size="10" font-weight="600" letter-spacing="1.2" fill="#8896a8">NAMESPACE · ML-TRAINING</text>
  <rect x="30" y="80" width="210" height="72" rx="8" fill="#3d3320" stroke="#a5822f" stroke-width="1.5"/>
  <text x="135" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#e0cfa8">CronJob retrain</text>
  <text x="135" y="123" text-anchor="middle" font-size="11" fill="#8896a8">0 2 * * * · Asia/Singapore</text>
  <text x="135" y="137" text-anchor="middle" font-size="11" fill="#8896a8">concurrencyPolicy: Forbid</text>
  <rect x="290" y="80" width="190" height="72" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="385" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Job retrain-29012</text>
  <text x="385" y="123" text-anchor="middle" font-size="11" fill="#8896a8">backoffLimit: 2</text>
  <text x="385" y="137" text-anchor="middle" font-size="11" fill="#8896a8">activeDeadline: 4h</text>
  <rect x="530" y="40" width="260" height="240" rx="12" fill="#2a2f37" stroke="#3f4854" stroke-width="1.5"/>
  <text x="544" y="59" font-size="10" font-weight="600" letter-spacing="1.2" fill="#8896a8">POD</text>
  <rect x="545" y="80" width="230" height="56" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="660" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">init: fetch-data</text>
  <text x="660" y="122" text-anchor="middle" font-size="11" fill="#8896a8">bucket → /data</text>
  <rect x="545" y="180" width="230" height="64" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="660" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">train</text>
  <text x="660" y="226" text-anchor="middle" font-size="11" fill="#8896a8">reads /data, writes /out</text>
  <rect x="820" y="180" width="150" height="64" rx="8" fill="#1f3529" stroke="#4a8f6a" stroke-width="1.5"/>
  <text x="895" y="207" text-anchor="middle" font-size="13" font-weight="700" fill="#b8dcc6">PVC</text>
  <text x="895" y="226" text-anchor="middle" font-size="11" fill="#8896a8">RWO · 100Gi · Retain</text>
  <polyline points="242,116 288,116" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="265" y="108" text-anchor="middle" font-size="11" fill="#8896a8" stroke="#202329" stroke-width="4" paint-order="stroke">02:00</text>
  <polyline points="482,116 528,116" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="505" y="108" text-anchor="middle" font-size="11" fill="#8896a8" stroke="#202329" stroke-width="4" paint-order="stroke">retries</text>
  <polyline points="660,138 660,178" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="777,212 818,212" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="797" y="204" text-anchor="middle" font-size="11" fill="#8896a8" stroke="#202329" stroke-width="4" paint-order="stroke">mount</text>
  <rect x="820" y="330" width="150" height="64" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="895" y="357" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Model registry</text>
  <text x="895" y="376" text-anchor="middle" font-size="11" fill="#8896a8">models/v8/</text>
  <polyline points="660,246 660,362 818,362" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="740" y="354" text-anchor="middle" font-size="11" fill="#8896a8">push model</text>
  <text x="30" y="326" text-anchor="start" font-size="10" fill="#8896a8" font-weight="600">WHAT FORBID DOES WHEN A RUN OVERRUNS</text>
  <polyline points="30,400 600,400" fill="none" stroke="#5b6675" stroke-width="1.5"/>
  <line x1="60" y1="394" x2="60" y2="406" stroke="#5b6675" stroke-width="1.5"/>
  <text x="60" y="419" text-anchor="middle" font-size="10" fill="#8896a8">Mon 02:00</text>
  <line x1="250" y1="394" x2="250" y2="406" stroke="#5b6675" stroke-width="1.5"/>
  <text x="250" y="419" text-anchor="middle" font-size="10" fill="#8896a8">Tue 02:00</text>
  <line x1="440" y1="394" x2="440" y2="406" stroke="#5b6675" stroke-width="1.5"/>
  <text x="440" y="419" text-anchor="middle" font-size="10" fill="#8896a8">Wed 02:00</text>
  <rect x="60" y="336" width="230" height="24" rx="6" fill="#3d3320" stroke="#a5822f" stroke-width="1.2"/>
  <text x="175" y="352" text-anchor="middle" font-size="10.5" fill="#e0cfa8" font-weight="600">Monday&#x27;s run overruns</text>
  <rect x="250" y="366" width="120" height="24" rx="6" fill="none" stroke="#5b6675" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="310" y="382" text-anchor="middle" font-size="10.5" fill="#8896a8" font-weight="600">Tue: skipped</text>
  <rect x="440" y="336" width="150" height="24" rx="6" fill="#1f3529" stroke="#4a8f6a" stroke-width="1.2"/>
  <text x="515" y="352" text-anchor="middle" font-size="10.5" fill="#b8dcc6" font-weight="600">Wed runs</text>
</svg>
