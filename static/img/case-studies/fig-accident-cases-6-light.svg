<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Query planning: the planner turns the officer&#x27;s message into vector search, keyword search, entity lookup and workflow rules; vector and keyword results are fused into ranked similar cases, while entity history and the workflow chosen by rules stay separate, and all three feed hydration and the answer">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a6f9a"/>
    </marker>
  </defs>

  <rect x="370" y="20" width="220" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="480" y="50" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Officer message</text>
  <rect x="330" y="110" width="300" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="480" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Query planner</text>
  <text x="480" y="154" text-anchor="middle" font-size="11" fill="#4a5568">LLM outputs a structured plan</text>
  <rect x="30" y="230" width="200" height="60" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="130" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Vector search</text>
  <text x="130" y="274" text-anchor="middle" font-size="11" fill="#4a5568">similar meaning</text>
  <rect x="265" y="230" width="200" height="60" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="365" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Keyword search</text>
  <text x="365" y="274" text-anchor="middle" font-size="11" fill="#4a5568">exact terms, IDs</text>
  <rect x="500" y="230" width="200" height="60" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="600" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Entity lookup</text>
  <text x="600" y="274" text-anchor="middle" font-size="11" fill="#4a5568">SQL, exact history</text>
  <rect x="735" y="230" width="200" height="60" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="835" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Workflow rules</text>
  <text x="835" y="274" text-anchor="middle" font-size="11" fill="#4a5568">decision table</text>
  <rect x="30" y="340" width="435" height="60" rx="8" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.5"/>
  <text x="247.5" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5c3d">Fuse similar cases</text>
  <text x="247.5" y="384" text-anchor="middle" font-size="11" fill="#4a5568">group by case · RRF · rerank</text>
  <rect x="500" y="340" width="200" height="60" rx="8" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.5"/>
  <text x="600" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5c3d">Entity history</text>
  <text x="600" y="384" text-anchor="middle" font-size="11" fill="#4a5568">kept separate</text>
  <rect x="735" y="340" width="200" height="60" rx="8" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.5"/>
  <text x="835" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5c3d">Workflow</text>
  <text x="835" y="384" text-anchor="middle" font-size="11" fill="#4a5568">catalog lookup by ID</text>
  <rect x="200" y="450" width="560" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="480" y="475" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Hydrate and answer</text>
  <text x="480" y="494" text-anchor="middle" font-size="11" fill="#4a5568">SQL facts · LLM cites sources</text>
  <polyline points="480,72 480,108" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="480,172 480,200 365,200 365,228" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="480,200 130,200 130,228" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
