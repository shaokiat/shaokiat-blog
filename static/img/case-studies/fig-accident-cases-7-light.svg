<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 285" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Conversation loop: each officer message goes to the planner LLM call, which returns state updates; code validates and merges them into the case state and reruns only what changed against the stores; the answer LLM call replies from sectioned context; every turn is written to the audit log">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a6f9a"/>
    </marker>
  </defs>

  <rect x="20" y="60" width="150" height="76" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="95" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Officer</text>
  <text x="95" y="112" text-anchor="middle" font-size="11" fill="#4a5568">new message</text>
  <rect x="220" y="60" width="190" height="76" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="315" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">1 · Planner</text>
  <text x="315" y="105" text-anchor="middle" font-size="11" fill="#4a5568">LLM call</text>
  <text x="315" y="119" text-anchor="middle" font-size="11" fill="#4a5568">returns state updates</text>
  <rect x="460" y="60" width="190" height="76" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="555" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Code</text>
  <text x="555" y="105" text-anchor="middle" font-size="11" fill="#4a5568">validate · merge</text>
  <text x="555" y="119" text-anchor="middle" font-size="11" fill="#4a5568">rerun what changed</text>
  <rect x="700" y="60" width="190" height="76" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="795" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">2 · Answer</text>
  <text x="795" y="105" text-anchor="middle" font-size="11" fill="#4a5568">LLM call</text>
  <text x="795" y="119" text-anchor="middle" font-size="11" fill="#4a5568">from sectioned context</text>
  <polyline points="172,98 218,98" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="412,98 458,98" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="652,98 698,98" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="795,58 795,30 95,30 95,58" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="445" y="24" text-anchor="middle" font-size="11" fill="#4a5568" stroke="#ffffff" stroke-width="4" paint-order="stroke">cited reply · next turn</text>
  <rect x="220" y="200" width="190" height="68" rx="8" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.5"/>
  <text x="315" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5c3d">Stores</text>
  <text x="315" y="241" text-anchor="middle" font-size="11" fill="#4a5568">SQL · vectors</text>
  <text x="315" y="255" text-anchor="middle" font-size="11" fill="#4a5568">catalog · procedures</text>
  <rect x="460" y="200" width="190" height="68" rx="8" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.5"/>
  <text x="555" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5c3d">Case state</text>
  <text x="555" y="241" text-anchor="middle" font-size="11" fill="#4a5568">fields · recent turns</text>
  <text x="555" y="255" text-anchor="middle" font-size="11" fill="#4a5568">summary · per case</text>
  <rect x="700" y="200" width="190" height="68" rx="8" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.5"/>
  <text x="795" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5c3d">Audit log</text>
  <text x="795" y="241" text-anchor="middle" font-size="11" fill="#4a5568">plan · IDs · reply</text>
  <text x="795" y="255" text-anchor="middle" font-size="11" fill="#4a5568">every turn</text>
  <polyline points="520,138 520,170 315,170 315,198" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <polyline points="580,138 580,198" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <polyline points="795,138 795,198" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
