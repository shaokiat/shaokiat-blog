<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Three delivery phases separated by gates: intake and procedures, then similar case search after officer adoption and relevance feedback, then entity history and flags after governance is agreed">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4a7fa5"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="1000" height="140" rx="14" fill="#202329" stroke="#3f4854" stroke-width="1.5"/>
  <text x="26" y="30" font-size="10" font-weight="600" letter-spacing="1.2" fill="#8896a8">DELIVERY · EACH GATE MUST PASS BEFORE THE NEXT PHASE</text>
  <rect x="30" y="50" width="180" height="72" rx="8" fill="#3d3320" stroke="#a5822f" stroke-width="1.5"/>
  <text x="120" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#e0cfa8">Phase 1</text>
  <text x="120" y="93" text-anchor="middle" font-size="11" fill="#8896a8">intake</text>
  <text x="120" y="107" text-anchor="middle" font-size="11" fill="#8896a8">+ workflow guidance</text>
  <rect x="240" y="50" width="170" height="72" rx="8" fill="#2a2f37" stroke="#5b6675" stroke-width="1.5"/>
  <text x="325" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#8896a8">Gate</text>
  <text x="325" y="93" text-anchor="middle" font-size="11" fill="#8896a8">officer adoption</text>
  <text x="325" y="107" text-anchor="middle" font-size="11" fill="#8896a8">relevance feedback</text>
  <rect x="440" y="50" width="170" height="72" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="525" y="81" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Phase 2</text>
  <text x="525" y="100" text-anchor="middle" font-size="11" fill="#8896a8">similar case search</text>
  <rect x="640" y="50" width="170" height="72" rx="8" fill="#2a2f37" stroke="#5b6675" stroke-width="1.5"/>
  <text x="725" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#8896a8">Gate</text>
  <text x="725" y="93" text-anchor="middle" font-size="11" fill="#8896a8">governance agreed</text>
  <text x="725" y="107" text-anchor="middle" font-size="11" fill="#8896a8">access · audit · review</text>
  <rect x="840" y="50" width="150" height="72" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="915" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Phase 3</text>
  <text x="915" y="93" text-anchor="middle" font-size="11" fill="#8896a8">entity history</text>
  <text x="915" y="107" text-anchor="middle" font-size="11" fill="#8896a8">+ flags</text>
  <polyline points="212,86 238,86" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="412,86 438,86" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="612,86 638,86" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="812,86 838,86" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
