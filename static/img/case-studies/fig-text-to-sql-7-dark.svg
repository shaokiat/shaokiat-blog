  <text x="478" y="55" font-size="9" font-weight="600" letter-spacing="1" fill="#a5822f">LLM</text>
  <text x="540" y="79" text-anchor="middle" font-size="12" font-weight="600" fill="#e0cfa8">web_fact</text>
  <rect x="660" y="40" width="130" height="58" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
