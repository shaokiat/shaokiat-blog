  <polyline points="792,69 905,69 905,178" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <text x="848" y="61" text-anchor="middle" font-size="11" fill="#8896a8" stroke="#1b1b1d" stroke-width="4" paint-order="stroke">fail</text>
