  <text x="298" y="195" font-size="9" font-weight="600" letter-spacing="1" fill="#a5822f">LLM</text>
  <text x="355" y="219" text-anchor="middle" font-size="12" font-weight="600" fill="#e0cfa8">sql_writer</text>
  <rect x="470" y="180" width="140" height="58" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="478" y="195" font-size="9" font-weight="600" letter-spacing="1" fill="#4a7fa5">FUNCTION</text>
