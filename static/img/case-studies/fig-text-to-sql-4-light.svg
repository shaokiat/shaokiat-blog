<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Two options side by side: in option A the planner writes SQL with a placeholder upfront and code binds the checked web value; in option B a separate SQL writer LLM step writes the query after seeing the checked fact&#x27;s metadata">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a6f9a"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="1000" height="120" rx="12" fill="#eef2f6" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="24" y="29" font-size="10" font-weight="600" letter-spacing="1.2" fill="#52606d">OPTION A · SQL AT PLANNING</text>
  <rect x="10" y="150" width="1000" height="120" rx="12" fill="#eef2f6" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="24" y="169" font-size="10" font-weight="600" letter-spacing="1.2" fill="#52606d">OPTION B · FEED BACK BEFORE SQL</text>
  <rect x="30" y="40" width="140" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="100" y="63" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Planner</text>
  <text x="100" y="82" text-anchor="middle" font-size="11" fill="#4a5568">plan + SQL</text>
  <text x="100" y="96" text-anchor="middle" font-size="11" fill="#4a5568">with placeholder</text>
  <polyline points="172,75 192,75" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="194" y="40" width="140" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="264" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Web fact</text>
  <text x="264" y="89" text-anchor="middle" font-size="11" fill="#4a5568">typed value</text>
  <polyline points="336,75 356,75" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="358" y="40" width="140" height="70" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="428" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Checks</text>
  <text x="428" y="89" text-anchor="middle" font-size="11" fill="#4a5568">code</text>
  <polyline points="500,75 520,75" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="522" y="40" width="304" height="70" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="674" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Bind and run SQL</text>
  <text x="674" y="89" text-anchor="middle" font-size="11" fill="#4a5568">no LLM</text>
  <polyline points="828,75 848,75" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="850" y="40" width="140" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="920" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Answer</text>
  <rect x="30" y="180" width="140" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="100" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Planner</text>
  <text x="100" y="229" text-anchor="middle" font-size="11" fill="#4a5568">SQL intent</text>
  <polyline points="172,215 192,215" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="194" y="180" width="140" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="264" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Web fact</text>
  <text x="264" y="229" text-anchor="middle" font-size="11" fill="#4a5568">typed value</text>
  <polyline points="336,215 356,215" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="358" y="180" width="140" height="70" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="428" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Checks</text>
  <text x="428" y="229" text-anchor="middle" font-size="11" fill="#4a5568">code</text>
  <polyline points="500,215 520,215" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="522" y="180" width="140" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="592" y="203" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">SQL writer</text>
  <text x="592" y="222" text-anchor="middle" font-size="11" fill="#4a5568">LLM</text>
  <text x="592" y="236" text-anchor="middle" font-size="11" fill="#4a5568">sees fact metadata</text>
  <polyline points="664,215 684,215" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="686" y="180" width="140" height="70" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="756" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Run SQL</text>
  <text x="756" y="229" text-anchor="middle" font-size="11" fill="#4a5568">value bound</text>
  <polyline points="828,215 848,215" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="850" y="180" width="140" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="920" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Answer</text>
</svg>
