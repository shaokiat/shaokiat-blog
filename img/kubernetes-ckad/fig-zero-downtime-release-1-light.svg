<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Two release strategies: blue/green switches a Service selector between two Deployments; canary puts both versions behind one selector and splits traffic by replica count">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a6f9a"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="480" height="380" rx="14" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="26" y="30" font-size="10" font-weight="600" letter-spacing="1.2" fill="#52606d">BLUE/GREEN · SWITCH THE SELECTOR</text>
  <rect x="145" y="50" width="210" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="250" y="77" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Service web</text>
  <text x="250" y="96" text-anchor="middle" font-size="11" fill="#4a5568">selector: version=green</text>
  <rect x="30" y="220" width="200" height="64" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="130" y="247" text-anchor="middle" font-size="13" font-weight="700" fill="#52606d">Deployment web-blue</text>
  <text x="130" y="266" text-anchor="middle" font-size="11" fill="#4a5568">v1 · idle, kept warm</text>
  <rect x="270" y="220" width="200" height="64" rx="8" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.5"/>
  <text x="370" y="247" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5c3d">Deployment web-green</text>
  <text x="370" y="266" text-anchor="middle" font-size="11" fill="#4a5568">v2 · live</text>
  <polyline points="300,116 370,218" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="345" y="160" text-anchor="start" font-size="11" fill="#1f5c3d" font-weight="600">100%</text>
  <polyline points="200,116 130,218" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <text x="155" y="160" text-anchor="end" font-size="11" fill="#4a5568" font-weight="600">0%</text>
  <circle cx="70" cy="310" r="7" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="90" cy="310" r="7" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="110" cy="310" r="7" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="130" cy="310" r="7" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="150" cy="310" r="7" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="170" cy="310" r="7" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="310" cy="310" r="7" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.5"/>
  <circle cx="330" cy="310" r="7" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.5"/>
  <circle cx="350" cy="310" r="7" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.5"/>
  <circle cx="370" cy="310" r="7" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.5"/>
  <circle cx="390" cy="310" r="7" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.5"/>
  <circle cx="410" cy="310" r="7" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.5"/>
  <text x="250" y="356" text-anchor="middle" font-size="11" fill="#4a5568">Rollback: set the selector back to blue. Instant.</text>
  <text x="250" y="372" text-anchor="middle" font-size="11" fill="#4a5568">Cost: double capacity during the release.</text>
  <rect x="510" y="10" width="480" height="380" rx="14" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="526" y="30" font-size="10" font-weight="600" letter-spacing="1.2" fill="#52606d">CANARY · SPLIT BY REPLICA COUNT</text>
  <rect x="645" y="50" width="210" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="750" y="77" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Service web</text>
  <text x="750" y="96" text-anchor="middle" font-size="11" fill="#4a5568">selector: app=web</text>
  <rect x="530" y="220" width="200" height="64" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="630" y="247" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Deployment web-stable</text>
  <text x="630" y="266" text-anchor="middle" font-size="11" fill="#4a5568">v1 · 9 replicas</text>
  <rect x="770" y="220" width="200" height="64" rx="8" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.5"/>
  <text x="870" y="247" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5c3d">Deployment web-canary</text>
  <text x="870" y="266" text-anchor="middle" font-size="11" fill="#4a5568">v2 · 1 replica</text>
  <polyline points="700,116 630,218" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="655" y="160" text-anchor="end" font-size="11" fill="#4a5568" font-weight="600">≈ 90%</text>
  <polyline points="800,116 870,218" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="845" y="160" text-anchor="start" font-size="11" fill="#1f5c3d" font-weight="600">≈ 10%</text>
  <circle cx="545" cy="310" r="7" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <circle cx="565" cy="310" r="7" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <circle cx="585" cy="310" r="7" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <circle cx="605" cy="310" r="7" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <circle cx="625" cy="310" r="7" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <circle cx="645" cy="310" r="7" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <circle cx="665" cy="310" r="7" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <circle cx="685" cy="310" r="7" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <circle cx="705" cy="310" r="7" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <circle cx="860" cy="310" r="7" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.5"/>
  <text x="750" y="356" text-anchor="middle" font-size="11" fill="#4a5568">Rollback: scale the canary to 0.</text>
  <text x="750" y="372" text-anchor="middle" font-size="11" fill="#4a5568">Exact percentages need Gateway API or a mesh.</text>
</svg>
