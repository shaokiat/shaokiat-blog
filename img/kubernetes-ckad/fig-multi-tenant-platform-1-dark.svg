<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Multi-tenant cluster: each team namespace has a RoleBinding, ResourceQuota, LimitRange, default-deny NetworkPolicy and restricted Pod Security; the shared ingress controller may reach both namespaces, but traffic between team namespaces is blocked">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4a7fa5"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="980" height="420" rx="14" fill="#202329" stroke="#3f4854" stroke-width="1.5"/>
  <text x="26" y="30" font-size="10" font-weight="600" letter-spacing="1.2" fill="#8896a8">CLUSTER</text>
  <rect x="330" y="40" width="340" height="84" rx="12" fill="#2a2f37" stroke="#3f4854" stroke-width="1.5"/>
  <text x="344" y="59" font-size="10" font-weight="600" letter-spacing="1.2" fill="#8896a8">NAMESPACE · INGRESS</text>
  <rect x="380" y="62" width="240" height="48" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="500" y="91" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Ingress controller</text>
  <rect x="30" y="160" width="450" height="255" rx="12" fill="#2a2f37" stroke="#3f4854" stroke-width="1.5"/>
  <text x="44" y="179" font-size="10" font-weight="600" letter-spacing="1.2" fill="#8896a8">NAMESPACE · TEAM-A · POD SECURITY: RESTRICTED</text>
  <rect x="50" y="195" width="200" height="52" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="150" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">RoleBinding</text>
  <text x="150" y="235" text-anchor="middle" font-size="11" fill="#8896a8">group team-a → edit</text>
  <rect x="270" y="195" width="190" height="52" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="365" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">ResourceQuota</text>
  <text x="365" y="235" text-anchor="middle" font-size="11" fill="#8896a8">cpu 20 · memory 64Gi</text>
  <rect x="50" y="260" width="200" height="52" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="150" y="281" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">LimitRange</text>
  <text x="150" y="300" text-anchor="middle" font-size="11" fill="#8896a8">default requests</text>
  <rect x="270" y="260" width="190" height="52" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="365" y="281" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">NetworkPolicy</text>
  <text x="365" y="300" text-anchor="middle" font-size="11" fill="#8896a8">deny all · allow ns + ingress</text>
  <rect x="60" y="330" width="110" height="64" rx="8" fill="#1f3529" stroke="#4a8f6a" stroke-width="1.5"/>
  <text x="68" y="345" font-size="9" font-weight="600" letter-spacing="1" fill="#4a8f6a">POD</text>
  <text x="115" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#b8dcc6">svc-1</text>
  <rect x="185" y="330" width="110" height="64" rx="8" fill="#1f3529" stroke="#4a8f6a" stroke-width="1.5"/>
  <text x="193" y="345" font-size="9" font-weight="600" letter-spacing="1" fill="#4a8f6a">POD</text>
  <text x="240" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#b8dcc6">svc-2</text>
  <rect x="310" y="330" width="110" height="64" rx="8" fill="#1f3529" stroke="#4a8f6a" stroke-width="1.5"/>
  <text x="318" y="345" font-size="9" font-weight="600" letter-spacing="1" fill="#4a8f6a">POD</text>
  <text x="365" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#b8dcc6">svc-3</text>
  <rect x="520" y="160" width="450" height="255" rx="12" fill="#2a2f37" stroke="#3f4854" stroke-width="1.5"/>
  <text x="534" y="179" font-size="10" font-weight="600" letter-spacing="1.2" fill="#8896a8">NAMESPACE · TEAM-B · POD SECURITY: RESTRICTED</text>
  <rect x="540" y="195" width="200" height="52" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="640" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">RoleBinding</text>
  <text x="640" y="235" text-anchor="middle" font-size="11" fill="#8896a8">group team-b → edit</text>
  <rect x="760" y="195" width="190" height="52" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="855" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">ResourceQuota</text>
  <text x="855" y="235" text-anchor="middle" font-size="11" fill="#8896a8">cpu 20 · memory 64Gi</text>
  <rect x="540" y="260" width="200" height="52" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="640" y="281" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">LimitRange</text>
  <text x="640" y="300" text-anchor="middle" font-size="11" fill="#8896a8">default requests</text>
  <rect x="760" y="260" width="190" height="52" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="855" y="281" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">NetworkPolicy</text>
  <text x="855" y="300" text-anchor="middle" font-size="11" fill="#8896a8">deny all · allow ns + ingress</text>
  <rect x="550" y="330" width="110" height="64" rx="8" fill="#1f3529" stroke="#4a8f6a" stroke-width="1.5"/>
  <text x="558" y="345" font-size="9" font-weight="600" letter-spacing="1" fill="#4a8f6a">POD</text>
  <text x="605" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#b8dcc6">svc-1</text>
  <rect x="675" y="330" width="110" height="64" rx="8" fill="#1f3529" stroke="#4a8f6a" stroke-width="1.5"/>
  <text x="683" y="345" font-size="9" font-weight="600" letter-spacing="1" fill="#4a8f6a">POD</text>
  <text x="730" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#b8dcc6">svc-2</text>
  <rect x="800" y="330" width="110" height="64" rx="8" fill="#1f3529" stroke="#4a8f6a" stroke-width="1.5"/>
  <text x="808" y="345" font-size="9" font-weight="600" letter-spacing="1" fill="#4a8f6a">POD</text>
  <text x="855" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#b8dcc6">svc-3</text>
  <polyline points="450,112 255,158" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="338" y="128" text-anchor="middle" font-size="11" fill="#8896a8" stroke="#202329" stroke-width="4" paint-order="stroke">allowed</text>
  <polyline points="550,112 745,158" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="662" y="128" text-anchor="middle" font-size="11" fill="#8896a8" stroke="#202329" stroke-width="4" paint-order="stroke">allowed</text>
  <polyline points="392,362 548,362" fill="none" stroke="#a5822f" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="470" y="352" text-anchor="middle" font-size="11" fill="#e0cfa8" stroke="#2a2f37" stroke-width="4" paint-order="stroke" font-weight="600">✕ blocked</text>
</svg>
