<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Top: training features come from the cleaned historian and serving features are reimplemented on raw telemetry, so the model gets different inputs and loses 5 AUC points with no error. Bottom: the training job and the monthly batch job call the same build_features function and the same serialized Pipeline">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4a7fa5"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="880" height="170" rx="14" fill="#202329" stroke="#3f4854" stroke-width="1.5"/>
  <text x="26" y="30" font-size="10" font-weight="600" letter-spacing="1.2" fill="#8896a8">SKEW · TWO CODE PATHS</text>
  <rect x="40" y="50" width="170" height="50" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="125" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Historian</text>
  <text x="125" y="89" text-anchor="middle" font-size="11" fill="#8896a8">cleaned, deduplicated</text>
  <rect x="260" y="50" width="190" height="50" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="355" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Training features</text>
  <text x="355" y="89" text-anchor="middle" font-size="11" fill="#8896a8">notebook code</text>
  <rect x="40" y="116" width="170" height="50" rx="8" fill="#2a2f37" stroke="#5b6675" stroke-width="1.5"/>
  <text x="125" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#8896a8">Raw telemetry</text>
  <text x="125" y="155" text-anchor="middle" font-size="11" fill="#8896a8">duplicates on retry</text>
  <rect x="260" y="116" width="190" height="50" rx="8" fill="#2a2f37" stroke="#5b6675" stroke-width="1.5"/>
  <text x="355" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#8896a8">Serving features</text>
  <text x="355" y="155" text-anchor="middle" font-size="11" fill="#8896a8">reimplemented</text>
  <rect x="520" y="82" width="150" height="50" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="595" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Model</text>
  <text x="595" y="121" text-anchor="middle" font-size="11" fill="#8896a8">Pipeline artifact</text>
  <rect x="720" y="82" width="150" height="50" rx="8" fill="#2a2f37" stroke="#5b6675" stroke-width="1.5"/>
  <text x="795" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#8896a8">Scores</text>
  <text x="795" y="121" text-anchor="middle" font-size="11" fill="#8896a8">AUC −5 pts, no error</text>
  <polyline points="212,75 258,75" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="212,141 258,141" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="452,75 486,75 486,100 518,100" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="452,141 486,141 486,114 518,114" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="672,107 718,107" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="10" y="200" width="880" height="170" rx="14" fill="#202329" stroke="#3f4854" stroke-width="1.5"/>
  <text x="26" y="220" font-size="10" font-weight="600" letter-spacing="1.2" fill="#8896a8">ONE CODE PATH</text>
  <rect x="40" y="240" width="170" height="50" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="125" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Training job</text>
  <text x="125" y="279" text-anchor="middle" font-size="11" fill="#8896a8">historical snapshots</text>
  <rect x="40" y="306" width="170" height="50" rx="8" fill="#1e3347" stroke="#4a7fa5" stroke-width="1.5"/>
  <text x="125" y="326" text-anchor="middle" font-size="13" font-weight="700" fill="#c5d5e8">Monthly batch job</text>
  <text x="125" y="345" text-anchor="middle" font-size="11" fill="#8896a8">snapshot = today</text>
  <rect x="260" y="266" width="190" height="56" rx="8" fill="#3d3320" stroke="#a5822f" stroke-width="1.5"/>
  <text x="355" y="289" text-anchor="middle" font-size="13" font-weight="700" fill="#e0cfa8">build_features</text>
  <text x="355" y="308" text-anchor="middle" font-size="11" fill="#8896a8">(events, snapshot_date)</text>
  <rect x="520" y="266" width="150" height="56" rx="8" fill="#3d3320" stroke="#a5822f" stroke-width="1.5"/>
  <text x="595" y="289" text-anchor="middle" font-size="13" font-weight="700" fill="#e0cfa8">Pipeline</text>
  <text x="595" y="308" text-anchor="middle" font-size="11" fill="#8896a8">one serialized artifact</text>
  <rect x="720" y="266" width="150" height="56" rx="8" fill="#1f3529" stroke="#4a8f6a" stroke-width="1.5"/>
  <text x="795" y="289" text-anchor="middle" font-size="13" font-weight="700" fill="#b8dcc6">Scores</text>
  <text x="795" y="308" text-anchor="middle" font-size="11" fill="#8896a8">match training</text>
  <polyline points="212,265 236,265 236,286 258,286" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="212,331 236,331 236,302 258,302" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="452,294 518,294" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="672,294 718,294" fill="none" stroke="#4a7fa5" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
