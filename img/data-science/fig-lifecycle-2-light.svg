  <text x="332" y="139" text-anchor="middle" font-size="11" fill="#4a5568">90 days of events</text>
  <rect x="440" y="106" width="72" height="38" rx="8" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.5"/>
