  <text x="402" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5c3d">label</text>
  <line x1="366" y1="42" x2="366" y2="92" stroke="#d97706" stroke-width="2"/>
  <text x="30" y="131" text-anchor="start" font-size="11" fill="#1e3a4f" font-weight="600">Snapshot 1 Feb</text>
  <rect x="224" y="106" width="216" height="38" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
