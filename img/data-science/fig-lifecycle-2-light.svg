  <rect x="298" y="164" width="216" height="38" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="406" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">features</text>
  <text x="406" y="197" text-anchor="middle" font-size="11" fill="#4a5568">90 days of events</text>
  <rect x="514" y="164" width="72" height="38" rx="8" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.5"/>
  <text x="550" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5c3d">label</text>
