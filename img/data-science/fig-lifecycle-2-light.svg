<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Four rows. Three historical snapshots, one month apart, each with a 90-day feature window before the snapshot date and a 30-day label window after it. A fourth row scores today: features from the last 90 days, label not yet known">
