<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Two rows of six monthly snapshots. Top: random stratified 5-fold mixes validation rows into every month, giving 0.87 validation AUC but 0.79 in production. Bottom: time-based split trains on January to April, validates on May and tests once on June, giving 0.82 validation and 0.81 in production">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a6f9a"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="880" height="150" rx="14" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="26" y="30" font-size="10" font-weight="600" letter-spacing="1.2" fill="#52606d">RANDOM STRATIFIED 5-FOLD · VALIDATION 0.87 → PRODUCTION 0.79</text>
  <rect x="40" y="44" width="120" height="56" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="100" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Jan</text>
  <text x="100" y="86" text-anchor="middle" font-size="11" fill="#4a5568">train + val</text>
  <rect x="82" y="108" width="35" height="18" rx="9" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.2"/><text x="99.5" y="121" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f5c3d">val</text>
  <rect x="180" y="44" width="120" height="56" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="240" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Feb</text>
  <text x="240" y="86" text-anchor="middle" font-size="11" fill="#4a5568">train + val</text>
  <rect x="222" y="108" width="35" height="18" rx="9" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.2"/><text x="239.5" y="121" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f5c3d">val</text>
  <rect x="320" y="44" width="120" height="56" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="380" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Mar</text>
  <text x="380" y="86" text-anchor="middle" font-size="11" fill="#4a5568">train + val</text>
  <rect x="362" y="108" width="35" height="18" rx="9" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.2"/><text x="379.5" y="121" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f5c3d">val</text>
  <rect x="460" y="44" width="120" height="56" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="520" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Apr</text>
  <text x="520" y="86" text-anchor="middle" font-size="11" fill="#4a5568">train + val</text>
  <rect x="502" y="108" width="35" height="18" rx="9" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.2"/><text x="519.5" y="121" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f5c3d">val</text>
  <rect x="600" y="44" width="120" height="56" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="660" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">May</text>
  <text x="660" y="86" text-anchor="middle" font-size="11" fill="#4a5568">train + val</text>
  <rect x="642" y="108" width="35" height="18" rx="9" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.2"/><text x="659.5" y="121" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f5c3d">val</text>
  <rect x="740" y="44" width="120" height="56" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="800" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Jun</text>
  <text x="800" y="86" text-anchor="middle" font-size="11" fill="#4a5568">train + val</text>
  <rect x="782" y="108" width="35" height="18" rx="9" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.2"/><text x="799.5" y="121" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1f5c3d">val</text>
  <text x="450" y="148" text-anchor="middle" font-size="11" fill="#4a5568" stroke="#f6f8fa" stroke-width="4" paint-order="stroke">every fold validates on all months, so May data helps score February</text>
  <rect x="10" y="180" width="880" height="170" rx="14" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="26" y="200" font-size="10" font-weight="600" letter-spacing="1.2" fill="#52606d">TIME-BASED SPLIT · VALIDATION 0.82 → PRODUCTION 0.81</text>
  <rect x="40" y="214" width="120" height="56" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="100" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Jan</text>
  <text x="100" y="256" text-anchor="middle" font-size="11" fill="#4a5568">train</text>
  <rect x="180" y="214" width="120" height="56" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="240" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Feb</text>
  <text x="240" y="256" text-anchor="middle" font-size="11" fill="#4a5568">train</text>
  <rect x="320" y="214" width="120" height="56" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="380" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Mar</text>
  <text x="380" y="256" text-anchor="middle" font-size="11" fill="#4a5568">train</text>
  <rect x="460" y="214" width="120" height="56" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="520" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Apr</text>
  <text x="520" y="256" text-anchor="middle" font-size="11" fill="#4a5568">train</text>
  <rect x="600" y="214" width="120" height="56" rx="8" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.5"/>
  <text x="660" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5c3d">May</text>
  <text x="660" y="256" text-anchor="middle" font-size="11" fill="#4a5568">validate</text>
  <rect x="740" y="214" width="120" height="56" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="800" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Jun</text>
  <text x="800" y="256" text-anchor="middle" font-size="11" fill="#4a5568">test · once</text>
  <polyline points="40,296 860,296" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="450" y="314" text-anchor="middle" font-size="11" fill="#4a5568" stroke="#f6f8fa" stroke-width="4" paint-order="stroke">time</text>
  <text x="450" y="338" text-anchor="middle" font-size="11" fill="#4a5568" stroke="#f6f8fa" stroke-width="4" paint-order="stroke">each stage only sees months before it, the way production does</text>
</svg>
