<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="System overview: the user&#x27;s question goes to the planner, which reads the database schema; when it needs the web, the web fact step searches trusted sources and extracts one typed fact, checks verify it, and the SQL writer, validator and execute steps run the query on the read-only database; failed checks or an invalid query after one retry go to the answer as a caveat; shared state and an audit log sit under every step">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a6f9a"/>
    </marker>
  </defs>

  <rect x="380" y="20" width="240" height="64" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="500" y="47" text-anchor="middle" font-size="13" font-weight="700" fill="#52606d">User</text>
  <text x="500" y="66" text-anchor="middle" font-size="11" fill="#4a5568">question in plain English</text>
  <rect x="380" y="110" width="240" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="137" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Planner</text>
  <text x="500" y="156" text-anchor="middle" font-size="11" fill="#4a5568">agent · schema tools only</text>
  <rect x="380" y="220" width="240" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="247" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Web fact</text>
  <text x="500" y="266" text-anchor="middle" font-size="11" fill="#4a5568">code search + 1 LLM extraction</text>
  <rect x="380" y="330" width="240" height="64" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="500" y="357" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Checks</text>
  <text x="500" y="376" text-anchor="middle" font-size="11" fill="#4a5568">source · range · definition</text>
  <rect x="380" y="440" width="240" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="467" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">SQL writer</text>
  <text x="500" y="486" text-anchor="middle" font-size="11" fill="#4a5568">LLM · uses fact metadata</text>
  <rect x="380" y="550" width="240" height="64" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="500" y="577" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">SQL validator</text>
  <text x="500" y="596" text-anchor="middle" font-size="11" fill="#4a5568">read-only · columns · placeholder</text>
  <rect x="380" y="660" width="240" height="64" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="500" y="687" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Execute</text>
  <text x="500" y="706" text-anchor="middle" font-size="11" fill="#4a5568">bind value · run SQL</text>
  <rect x="380" y="770" width="240" height="64" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="797" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Answer</text>
  <text x="500" y="816" text-anchor="middle" font-size="11" fill="#4a5568">result + provenance</text>
  <rect x="40" y="220" width="200" height="64" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="140" y="247" text-anchor="middle" font-size="13" font-weight="700" fill="#52606d">Web</text>
  <text x="140" y="266" text-anchor="middle" font-size="11" fill="#4a5568">trusted sources only</text>
  <rect x="760" y="330" width="200" height="76" rx="8" fill="#e3f1e8" stroke="#2d7a52" stroke-width="1.5"/>
  <text x="860" y="363" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5c3d">Database</text>
  <text x="860" y="382" text-anchor="middle" font-size="11" fill="#4a5568">read-only role</text>
  <polyline points="500,86 500,108" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="500,176 500,218" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="508" y="202" text-anchor="start" font-size="11" fill="#4a5568" stroke="#ffffff" stroke-width="4" paint-order="stroke">needs web</text>
  <polyline points="500,286 500,328" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="500,396 500,438" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="508" y="422" text-anchor="start" font-size="11" fill="#4a5568" stroke="#ffffff" stroke-width="4" paint-order="stroke">pass</text>
  <polyline points="500,506 500,548" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="500,616 500,658" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="508" y="642" text-anchor="start" font-size="11" fill="#4a5568" stroke="#ffffff" stroke-width="4" paint-order="stroke">pass</text>
  <polyline points="500,726 500,768" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="242,252 378,252" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="310" y="246" text-anchor="middle" font-size="11" fill="#4a5568" stroke="#ffffff" stroke-width="4" paint-order="stroke">allowlist</text>
  <polyline points="622,130 860,130 860,328" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="742" y="124" text-anchor="middle" font-size="11" fill="#4a5568" stroke="#ffffff" stroke-width="4" paint-order="stroke">schema discovery</text>
  <polyline points="622,692 860,692 860,408" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="742" y="686" text-anchor="middle" font-size="11" fill="#4a5568" stroke="#ffffff" stroke-width="4" paint-order="stroke">read-only</text>
  <polyline points="622,156 700,156 700,456 622,456" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="708" y="300" text-anchor="start" font-size="11" fill="#4a5568" stroke="#ffffff" stroke-width="4" paint-order="stroke">no web</text>
  <polyline points="622,600 660,600 660,488 622,488" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="668" y="548" text-anchor="start" font-size="11" fill="#4a5568" stroke="#ffffff" stroke-width="4" paint-order="stroke">retry, max 1</text>
  <polyline points="378,362 300,362 300,794 378,794" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <text x="339" y="356" text-anchor="middle" font-size="11" fill="#4a5568" stroke="#ffffff" stroke-width="4" paint-order="stroke">fail</text>
  <polyline points="378,582 330,582 330,814 378,814" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <text x="354" y="576" text-anchor="middle" font-size="11" fill="#4a5568" stroke="#ffffff" stroke-width="4" paint-order="stroke">fail</text>
  <text x="290" y="640" text-anchor="end" font-size="11" fill="#4a5568" stroke="#ffffff" stroke-width="4" paint-order="stroke" font-style="italic">caveat</text>
  <rect x="20" y="856" width="960" height="34" rx="12" fill="#eef2f6" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="34" y="875" font-size="10" font-weight="600" letter-spacing="1.2" fill="#52606d">UNDER EVERY STEP · SHARED STATE + AUDIT LOG</text>
</svg>
