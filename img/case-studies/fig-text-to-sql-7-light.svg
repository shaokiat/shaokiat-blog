  <text x="540" y="79" text-anchor="middle" font-size="12" font-weight="600" fill="#713f12">web_fact</text>
  <rect x="660" y="40" width="130" height="58" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
