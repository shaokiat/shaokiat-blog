  <text x="298" y="195" font-size="9" font-weight="600" letter-spacing="1" fill="#d97706">LLM</text>
  <text x="355" y="219" text-anchor="middle" font-size="12" font-weight="600" fill="#713f12">sql_writer</text>
  <rect x="470" y="180" width="140" height="58" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
