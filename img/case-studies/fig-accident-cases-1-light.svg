<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Five areas in order: framing, decomposition, architecture, guardrails and evaluation, delivery, each with the output it produces">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3a6f9a"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="980" height="170" rx="14" fill="#f6f8fa" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="26" y="30" font-size="10" font-weight="600" letter-spacing="1.2" fill="#52606d">CASE STUDY BREAKDOWN · WORK LEFT TO RIGHT</text>
  <rect x="30" y="46" width="168" height="76" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="114" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Framing</text>
  <text x="114" y="91" text-anchor="middle" font-size="11" fill="#4a5568">goal · users · I/O</text>
  <text x="114" y="105" text-anchor="middle" font-size="11" fill="#4a5568">data · risk</text>
  <text x="114" y="148" text-anchor="middle" font-size="11" fill="#52606d" font-weight="600">→ refined problem</text>
  <polyline points="200,84 220,84" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="222" y="46" width="168" height="76" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="306" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">Decomposition</text>
  <text x="306" y="91" text-anchor="middle" font-size="11" fill="#4a5568">capabilities</text>
  <text x="306" y="105" text-anchor="middle" font-size="11" fill="#4a5568">which are RAG</text>
  <text x="306" y="148" text-anchor="middle" font-size="11" fill="#52606d" font-weight="600">→ capability table</text>
  <polyline points="392,84 412,84" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="414" y="46" width="168" height="76" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="498" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Architecture</text>
  <text x="498" y="91" text-anchor="middle" font-size="11" fill="#4a5568">write path</text>
  <text x="498" y="105" text-anchor="middle" font-size="11" fill="#4a5568">read path</text>
  <text x="498" y="148" text-anchor="middle" font-size="11" fill="#52606d" font-weight="600">→ components</text>
  <polyline points="584,84 604,84" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="606" y="46" width="168" height="76" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="690" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Guardrails</text>
  <text x="690" y="91" text-anchor="middle" font-size="11" fill="#4a5568">grounding · access</text>
  <text x="690" y="105" text-anchor="middle" font-size="11" fill="#4a5568">metrics</text>
  <text x="690" y="148" text-anchor="middle" font-size="11" fill="#52606d" font-weight="600">→ rules + metrics</text>
  <polyline points="776,84 796,84" fill="none" stroke="#3a6f9a" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="798" y="46" width="168" height="76" rx="8" fill="#dce8f5" stroke="#3a6f9a" stroke-width="1.5"/>
  <text x="882" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a4f">Delivery</text>
  <text x="882" y="91" text-anchor="middle" font-size="11" fill="#4a5568">phases</text>
  <text x="882" y="105" text-anchor="middle" font-size="11" fill="#4a5568">gates</text>
  <text x="882" y="148" text-anchor="middle" font-size="11" fill="#52606d" font-weight="600">→ roadmap</text>
</svg>
